[mod-setting-description]
si-inserters-chase-belt-items=Манипуляторы будут следовать ванильным правилам и преследовать движущиеся предметы на конвейерах.\n[color=red][font=default-bold]Внимание:[/font] Это может вызвать проблемы с UPS. Рекомендуется = false.[/color]
si-range-adder=Управляет тем, как масштабируются расстояния манипуляторов и как применяется настройка "Максимальный радиус манипуляторов".\n\n[font=default-bold][color=orange]"Inserter"[/color][/font]\nМаксимальный радиус заблокирован на ванильном значении по умолчанию. (Настройка максимального радиуса игнорируется). Они всё ещё могут доставать ближе, чем их значение по умолчанию.\n\n[font=default-bold][color=orange]"Incremental"[/color][/font]\nНастройка максимального радиуса действует как [color=green]бонусное приращение[/color], добавляемое к ванильному значению по умолчанию. (Например, длинный манипулятор достаёт дальше обычного).\n\n[font=default-bold][color=orange]"Equal"[/color][/font]\nВсе манипуляторы имеют одинаковый максимальный радиус, определяемый настройкой максимального радиуса.\n\n[font=default-bold][color=orange]"Rebase"[/color][/font]\nКак "Equal", но их [color=red]минимальный радиус[/color] ограничен ванильным значением по умолчанию. (Например, длинный манипулятор не может захватывать с расстояния в 1 клетку).\n\n[font=default-bold][color=orange]"Incremental-with-Rebase"[/color][/font]\nСочетает Incremental и Rebase. Максимальный радиус получает бонус, но минимальный радиус ограничен ванильным значением по умолчанию.\n\n[font=default-bold][color=orange]"Inserter-with-Rebase"[/color][/font]\nРадиус действия строго заблокирован на ванильном значении по умолчанию. Они не могут доставать дальше или ближе.
si-max-inserters-range=Устанавливает абсолютный максимальный радиус (1-6 клеток) для любого манипулятора.\n[color=green]Рекомендуется = 3[/color]
si-disable-long-inserters=Скрывает рецепты и отключает крафт всех ванильных длинных манипуляторов.
si-directional-inserters=Заставляет манипуляторы захватывать только с одной стороны и выбрасывать строго на противоположную сторону.
si-single-line-inserters=Запрещает манипуляторам выбрасывать предметы по диагонали (только прямые линии).
si-directional-slim-inserters=Заставляет тонких манипуляторов захватывать только с одной стороны и выбрасывать строго на противоположную сторону.
si-single-line-slim-inserters=Запрещает тонким манипуляторам выбрасывать предметы по диагонали.
si-diagonal-technologies=Включает диагональное дерево технологий.\n[color=yellow]Примечание: Без уровня 1 позиции манипуляторов нельзя редактировать.[/color]
si-range-technologies=Включает дерево технологий радиуса действия.\n[color=yellow]Примечание: Без уровня 1 позиции манипуляторов нельзя редактировать.[/color]
si-offset-technologies=Включает дерево технологий смещения (позволяет микронастройку).
si-offset-selector=Переключает видимость интерфейса смещения захвата/выброса в конфигураторе.
si-technologies-difficulty=Выбирает множитель стоимости и сложность дерева технологий Smart Inserter.
si-disable-inserters-consumption=Полностью отключает потребление энергии всеми манипуляторами.
si-swap-clicks=Меняет местами поведение левой и правой кнопок мыши при настройке позиций прямо в мире.

