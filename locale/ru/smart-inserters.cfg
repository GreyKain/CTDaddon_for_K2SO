si-si-direction=Направление
si-si-direction-tooltip=[font=default-bold][color=yellow]Копирует физическую базовую ориентацию.[/color][/font]\nЗаставляет манипулятор назначения направить свою физическую базу в том же абсолютном направлении, что и исходный манипулятор.
si-relative-si-direction=Относительная ориентация
si-relative-si-direction-tooltip=[font=default-bold][color=yellow]Сохраняет позиции относительно базы.[/color][/font]\nЕсли отмечено (ванильное поведение), позиции применяются [font=default-bold]относительно базы манипулятора[/font].\nЕсли не отмечено, позиции рассматриваются как абсолютные направленные смещения (например, если источник выбрасывал на север, назначение также будет выбрасывать на север, независимо от того, куда направлена его база).

