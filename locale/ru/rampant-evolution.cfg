[mod-setting-description]
rampant-evolution-fixed--toggleResearchEvolutionMultiplier=Включает множитель эволюции за исследования, который увеличивает прирост эволюции в зависимости от числа завершённых исследований.
rampant-evolution-fixed--startResearchMultiplier=Процентный прирост эволюции в зависимости от числа завершённых исследований. Формула множителя: x^<показатель степени множителя исследований>, где x = завершённые исследования / все исследования. Эта настройка задаёт начальное значение множителя. Напр., 0.2 соответствует 120%.
rampant-evolution-fixed--endResearchMultiplier=Процентный прирост эволюции в зависимости от числа завершённых исследований. Формула множителя: x^<показатель степени множителя исследований>, где x = завершённые исследования / все исследования. Эта настройка задаёт конечное значение множителя. Напр., 0.2 соответствует 120%.
rampant-evolution-fixed--researchMultiplierExponent=Показатель степени для множителя эволюции за исследования. Формула: x^<показатель степени множителя исследований>, где x = завершённые исследования / все исследования

rampant-evolution-fixed--toggleTickEvolutionMultiplier=Включает множитель эволюции за время, который увеличивает прирост эволюции в зависимости от длительности игры.
rampant-evolution-fixed--startTickMultiplier=Процентный прирост эволюции в зависимости от числа прошедших в игре тиков. Формула множителя: x^<показатель степени множителя за время>, где x = тики в игре / <общее число тиков модификатора эволюции>. Эта настройка задаёт начальное значение множителя. Напр., 0.2 соответствует 120%.
rampant-evolution-fixed--endTickMultiplier=Процентный прирост эволюции в зависимости от числа прошедших в игре тиков. Формула множителя: x^<показатель степени множителя за время>, где x = тики в игре / <общее число тиков модификатора эволюции>. Эта настройка задаёт конечное значение множителя. Напр., 0.2 соответствует 120%.
rampant-evolution-fixed--tickMultiplierExponent=Показатель степени для множителя эволюции за время. Формула: x^<показатель степени множителя за время>, где x = тики в игре / <общее число тиков модификатора эволюции>
rampant-evolution-fixed--totalTickMultiplier=Количество минут, которое должно пройти в игре для достижения конечного множителя за время

rampant-evolution-fixed--processingPerTick=Определяет, сколько раз за тик выполняется обработка при заданной точности восстановления.
rampant-evolution-fixed--evolutionPerLowPlayer=К дешёвым постройкам игрока относятся:\nammo-turret\nartillery-turret\nelectric-pole\nelectric-turret\nfluid-turret\nЭто число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--evolutionPerMediumPlayer=К средним постройкам игрока относятся:\naccumulator\ncontainer\nlab\nlogistic-container\nradar\nstorage-tank\nsolar-panel\nЭто число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--evolutionPerHighPlayer=К дорогим постройкам игрока относятся:\nassembling-machine\nbeacon\nboiler\nfurnace\ngenerator\nmining-drill\nreactor\nroboport\nrocket-silo\nЭто число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--researchEvolutionCap=Если включено, эволюция ограничивается количеством исследованных технологий. Каждая технология классифицируется по самому продвинутому научному набору. Все бесконечные технологии исключаются. После классификации всех технологий веса суммируются и делятся на общее число технологий. При исследовании технологии взвешенное значение эволюции добавляется к пределу эволюции.
rampant-evolution-fixed--technology-automation-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждого веса технологий можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-logistic-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-military-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-chemical-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-production-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-utility-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--technology-space-science-multiplier=Этот вес задаётся относительно других весов. Чем выше вес, тем сильнее эти технологии влияют на эволюцию. Максимальный потенциал каждой технологии можно увидеть в интерфейсе эволюции. Пример: если эта настройка равна 5, а остальные — 1, то каждая технология этой группы стоит в 5 раз больше, чем если бы вес тоже был 1.
rampant-evolution-fixed--evolutionPerWormKilled=Эта настройка определяет, как убийство червей влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerUnitKilled=Эта настройка определяет, как убийство особей кусак влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerHiveKilled=Эта настройка определяет, как убийство ульев Rampant влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerSpawnerKilled=Эта настройка определяет, как убийство ульев влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerTileAbsorbed=Эта настройка определяет, как поглощение загрязнения плитками влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerTreeDied=Эта настройка определяет, как повреждение деревьев загрязнением влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerTreeAbsorbed=Эта настройка определяет, как поглощение загрязнения деревьями влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed-evolutionPerSpawnerAbsorbed=Эта настройка определяет, как поглощение загрязнения ульями влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--evolutionPerPollution=Эта настройка определяет, как произведённое загрязнение влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--evolutionPerTime=Эта настройка определяет, как прошедшее время в секундах влияет на эволюцию. Это число следует интерпретировать так же, как стандартные ползунки загрязнения, ульев и времени.
rampant-evolution-fixed--recalculateAllEvolution=Если включено, при изменении настроек мода эволюция будет пересчитана с начала игры. Это не будет идеальным восстановлением прошлой эволюции.
rampant-evolution-fixed--displayEvolutionMsgInterval=Интервал вывода эволюции в консоль или интерфейс. Команда /rampantEvolution в консоли выводит статистику по запросу.
rampant-evolution-fixed--displayEvolutionMsg=Настройка включает вывод эволюции в консоль с заданным интервалом. Команда /rampantEvolution в консоли выводит статистику по запросу.
rampant-evolution-fixed--setMapSettingsToZero=Если у вас есть существующее сохранение, к которому вы хотите применить этот мод, и вы хотите приостановить исходные настройки эволюции карты. ЭТО НЕОБРАТИМО: ЕСЛИ ВЫ УДАЛИТЕ МОД С ВКЛЮЧЁННОЙ НАСТРОЙКОЙ, ЭВОЛЮЦИЯ ОСТАНЕТСЯ НА ПАУЗЕ. СНЯТИЕ ГАЛОЧКИ ДОЛЖНО СНОВА ВКЛЮЧИТЬ СТАНДАРТНУЮ ЭВОЛЮЦИЮ.
rampant-evolution-fixed--minimumDevolutionPercentage=Каждый раз, когда эволюция растёт, этот процент умножается на эволюцию и сохраняется как минимально достижимое значение эволюции. Так, если задать 0.25 и эволюция достигнет 10%, минимальное значение составит 2.5%.
rampant-evolution-fixed--evolutionResolutionLevel=Число шагов прироста, вычисляемых в одной точке. Чем выше число, тем ниже точность пересчёта эволюции. Обратная сторона: низкие числа требуют много времени на пересчёт. При значении 0 число рассчитывается автоматически исходя из числа тиков в игре. В авторежиме точность начинается с 20 и растёт до 4000 по формуле x = game.ticks / (200 ч). При 4000 пересчёт игры длительностью 200 часов займёт ~45 минут при processingPerTick = 1.
rampant-evolution-fixed--shortcut-bar=Показывать интерфейс статистики эволюции
rampant-evolution-fixed--researchEvolutionCapIncludeUpgrades=При подсчёте общего числа исследований учитывать технологии улучшений

[description]
rampant-evolution-fixed--refreshingEvolution=RampantEvolution: пересчёт эволюции, это может занять несколько минут. Во время пересчёта время выполнения скриптов будет выше.
rampant-evolution-fixed--displayEvolutionMsg=RampantEvolution:\n__1__%: текущая эволюция\n   __2__%: вклад поглощения загрязнения плитками\n   __3__%: вклад поглощения загрязнения деревьями\n   __4__%: вклад повреждения деревьев загрязнением\n   __5__%: вклад поглощения загрязнения ульями\n   __6__%: вклад убитых ульев\n   __7__%: вклад убитых ульев Rampant\n   __8__%: вклад убитых особей\n   __9__%: вклад убитых червей\n   __10__%: вклад произведённого загрязнения\n   __11__%: вклад прошедшего времени\n   __12__%: дешёвые постройки игрока\n   __13__%: средние постройки игрока\n   __14__%: дорогие постройки игрока\n   __15__%: множитель эволюции\n   __16__%: минимальная эволюция\n   __17__%: предел эволюции за исследования\n   __18__%: изменение эволюции за 5 минут\n   __19__%: изменение эволюции за 30 минут\n   __20__%: изменение эволюции за 60 минут

