[ltnc-tooltips]
ltnc-apply-instruction=Применить изменения
ltnc-cancel-instruction=Отменить изменения
signal-not-default=Сбросить к значению LTN по умолчанию
signal-is-default=Это значение по умолчанию
signal-confirm=Удерживайте [color=blue]SHIFT[/color], чтобы число осталось положительным

[ltnc-signal-tips]
min-max-default=\n\n[color=blue]По умолчанию:[/color] [color=green]__3__[/color]     [color=blue]Мин.:[/color] __1__  [color=blue]Макс.:[/color] __2__
zero-value=\n\n[color=red]Примечание:[/color] Значение «0» удалит этот сигнал из комбинатора, и LTN будет использовать значение по умолчанию.
ltn-network-id=Двоичный кодированный сигнал, назначающий станции конкретную сеть.
ltn-network-id-all=Установить все сети (-1 или 0xFFFFFFFF)
ltn-network-id-none=Очистить все сети (0 или 0x0)
ltn-depot=Помечает эту станцию как депо.\n[color=red]Все сигналы запроса и снабжения будут проигнорированы.\nЭто взаимоисключающе с сигналом заправочной станции.[/color]\nУдерживайте [color=blue]SHIFT[/color], чтобы удалить сигналы запроса и снабжения\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color] (не отмечено)
ltn-fuel-station=Помечает эту станцию как заправочную.\n[color=red]Все сигналы запроса и снабжения будут проигнорированы.\nЭто взаимоисключающе с сигналом депо.[/color]\nУдерживайте [color=blue]SHIFT[/color], чтобы удалить сигналы запроса и снабжения\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color] (не отмечено)
ltn-depot-priority=Более высокий приоритет обслуживается первым.
ltn-min-train-length=Минимальная длина локомотивов + вагонов, допустимая на этой станции. [color=green](0 означает отсутствие ограничения)[/color]
ltn-max-train-length=Максимальная длина локомотивов + вагонов, допустимая на этой станции. [color=green](0 означает отсутствие ограничения)[/color]
ltn-max-trains=Максимальное число поездов, которые могут быть одновременно назначены этой станции. [color=green](0 означает отсутствие ограничения)[/color]
ltn-requester-threshold=Требуемая нехватка предметов/жидкостей для запуска запроса.\nЭто значение игнорируется для предметов, если задан порог запроса стопок.
ltn-requester-stack-threshold=Требуемая нехватка стопок предметов для запуска запроса.\nЭтот сигнал игнорируется для жидкостей.
ltn-requester-priority=Более высокий приоритет обслуживается первым.
ltn-disable-warnings=Подавлять предупреждения вида: «Не найдена станция, снабжающая <X>, для этой станции запроса.»\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color] (не отмечено)
ltn-provider-threshold=Требуемый запас предметов/жидкостей для того, чтобы станция начала предлагать снабжение сети.\nЭто значение игнорируется для предметов, если задан порог снабжения стопок.
ltn-provider-stack-threshold=Требуемый запас стопок предметов для того, чтобы станция начала предлагать снабжение сети.\nЭтот сигнал игнорируется для жидкостей.
ltn-provider-priority=Более высокий приоритет обслуживается первым.
ltn-locked-slots=Количество заблокированных слотов на вагон для этой станции снабжения.

[mod-setting-name]
ltnc-use-stacks=Запрос в стопках
ltnc-negative-signals=Сигналы запроса должны быть отрицательными
ltnc-emit-default-network-id=Явный ID сети по умолчанию
ltnc-emit-explicit-default=Явный сигнал по умолчанию
ltnc-misc-signal-rows=Ряды сигналов
ltnc-high-threshold=Значение высокого порога
ltnc-disable-built-combinators=Принудительно отключать новые LTN-комбинаторы
ltnc-alert-build-disable=Создавать оповещение об отключении
ltnc-show-net-panel=Показывать панель сети
#ltnc-upgradable=Улучшаемый из постоянного комбинатора
#ltnc-slider-max-items=Максимум стопок запроса (предметы)
#ltnc-slider-max-fluid=Максимум запроса (жидкость)

[mod-setting-description]
ltnc-use-stacks=Если отмечено, запросы предметов будут вводиться в стопках, а не в штуках.\n\n[color=blue]По умолчанию:[/color] [color=green]Истина[/color]
ltnc-negative-signals=Если включено, новые сигналы «Предмет» и «Жидкость» будут отрицательными.\nУдержание [color=blue]SHIFT[/color] оставит значение положительным.\n\n[color=blue]По умолчанию:[/color] [color=green]Истина[/color]
ltnc-emit-default-network-id=Если включено, ID сети, совпадающий с ID сети LTN по умолчанию, не будет удаляться из комбинатора.\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color]
ltnc-emit-explicit-default=Если включено, вы можете задать сигнал, совпадающий со значением LTN по умолчанию. Он не будет удалён из комбинатора, если значение LTN по умолчанию изменится.\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color]
ltnc-misc-signal-rows=Количество рядов, доступных для управляющих сигналов, не относящихся к LTN.\n\n[color=blue]По умолчанию:[/color] [color=green]2[/color]
ltnc-high-threshold=Порог, устанавливаемый при отключении запроса/снабжения.\n\n[color=blue]По умолчанию:[/color] [color=green]2 147 483 647[/color]
ltnc-disable-built-combinators=У размещённых LTN-комбинаторов выбранные службы будут отключены.\nЭто касается: новых, созданных по чертежу и скопированных комбинаторов.\n\n[color=blue]По умолчанию:[/color] [color=green]Отключить запрос[/color]
ltnc-alert-build-disable=Создавать оповещение при размещении новых комбинаторов, которые принудительно выключены или имеют отключённые службы согласно настройке выше.\n\n[color=blue]По умолчанию:[/color] [color=green]истина[/color]
ltnc-show-net-panel=Показывать панель настройки ID сети по умолчанию вместо предпросмотра объекта.\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color]
#ltnc-upgradable=Считается улучшенной версией постоянного комбинатора. Планировщик улучшений по умолчанию будет помечать постоянные комбинаторы для улучшения до LTN-комбинаторов.\n\nЭто не влияет на быстрое улучшение.\n\n[color=blue]По умолчанию:[/color] [color=green]Ложь[/color]
#ltnc-slider-max-items=Максимальное количество предметов (стопок), которое можно запросить с помощью ползунка. Вы по-прежнему можете вводить большие значения напрямую.\n\n[color=blue]По умолчанию:[/color] [color=green]256[/color]
#ltnc-slider-max-fluid=Максимальное количество единиц жидкости, которое можно запросить с помощью ползунка. Вы по-прежнему можете вводить большие значения напрямую.\n\n[color=blue]По умолчанию:[/color] [color=green]500 тыс.[/color]

[string-mod-setting]
ltnc-disable-built-combinators-none=Ничего не отключено
ltnc-disable-built-combinators-requester=Отключить запрос
ltnc-disable-built-combinators-provider=Отключить снабжение
ltnc-disable-built-combinators-all=Оба отключены
ltnc-disable-built-combinators-off=Питание отключено

[string-mod-setting-description]
ltnc-disable-built-combinators-none=Ни запрос, ни снабжение не будут принудительно отключены. У новых комбинаторов обе службы останутся включёнными.\n\n[color=red]Примечание:[/color] При строительстве по чертежу или копировании комбинатора службы сохранят состояние чертежа или исходного объекта.
ltnc-disable-built-combinators-requester=Служба запроса будет отключена на всех новых комбинаторах. Это отключит запрос в комбинаторах из чертежа, даже если он включён в чертеже.\n\n[color=red]Примечание:[/color] Отключено означает, что на комбинаторе будет установлен высокий порог запроса.
ltnc-disable-built-combinators-provider=Служба снабжения будет отключена на всех новых комбинаторах. Это отключит снабжение в комбинаторах из чертежа, даже если оно включено в чертеже.\n\n[color=red]Примечание:[/color] Отключено означает, что на комбинаторе будет установлен высокий порог снабжения.
ltnc-disable-built-combinators-all=И запрос, и снабжение будут принудительно отключены. Это переопределит настройки в комбинаторах из чертежа.\n\n[color=red]Примечание:[/color] Отключено означает, что на комбинаторе будут установлены высокие пороги запроса и снабжения.
ltnc-disable-built-combinators-off=Комбинаторы будут размещены с отключённым питанием, пороги изменяться не будут.