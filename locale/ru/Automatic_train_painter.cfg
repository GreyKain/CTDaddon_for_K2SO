possible-custom-color-values=Значения R G B A должны быть от 0 до 255 включительно.\n
custom-colors-not-loaded=Automatic Train Painter | [img=utility/warning_icon] Предупреждение: пользовательские цвета не отформатированы как таблица. Цвета не загружены.
