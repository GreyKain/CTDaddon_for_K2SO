[mod-setting-description]
paint-fluid-wagon=Для корректной работы требуется мод с маской вагона-цистерны.
u-loco=Должно быть 3- или 6-значное шестнадцатеричное число либо пустое значение.\nСерый по умолчанию = [color=#E4D1C7][font=default-bold]E4D1C7[/font][/color]\nИсходный красный [item=locomotive] = [color=#EA1100][font=default-bold]EA1100[/font][/color]
u-cargo-wagon=Должно быть 3- или 6-значное шестнадцатеричное число либо пустое значение.\nПо умолчанию = [color=#6D3A00][font=default-bold]6D3A00[/font][/color]
u-fluid-wagon=Должно быть 3- или 6-значное шестнадцатеричное число либо пустое значение.\nПо умолчанию = [color=#C8C8C8][font=default-bold]C8C8C8[/font][/color]
custom-colors-list=Включает пользовательские цвета на вкладке карты.
loc-eqpm-grid-w=По умолчанию = 2\nМин. = 2\nМакс. = 16
loc-eqpm-grid-h=По умолчанию = 4\nМин. = 2\nМакс. = 16
loc-eqpm-module=Поместите в сетку оборудования локомотива, чтобы отключить автоматическую покраску соответствующего поезда. Требует работу сетки оборудования локомотива.
atp-ltn-paint=Красит поезда, отправленные Логистической сетью поездов, при выезде из депо. (Обычно когда загорается жёлтый сигнал.)
atp-custom-colors-enable=Выкл.: не использовать пользовательские цвета\nПриоритет: пользовательские цвета имеют приоритет над базой цветов мода.\nТолько: использовать только пользовательские цвета. База цветов мода игнорируется.
atp-custom-colors-list=Значение настройки должно быть отформатировано как таблица, как показано:\n\n[font=default-bold]{\n['item1']={r=000,g=000,b=000,a=000}\n['item2']={r=255,g=255,b=255,a=255}\n}[/font]\n\n[font=default-small]Имя предмета должно содержать только буквенно-цифровые символы, «-» или «_».\nЗначения r, g, b и a должны быть от 0 до 255.\nПрактического ограничения на количество строк таблицы нет.[/font]

[item-description]
manual-color-module=Поезда, оснащённые этим модулем, не будут краситься автоматически.

