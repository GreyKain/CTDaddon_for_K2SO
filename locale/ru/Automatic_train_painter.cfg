invalid-custom-item-name=Automatic Train Painter | [img=utility/warning_icon] Предупреждение: найдено неверное имя предмета: [font=default-large-bold]"__1__"[/font]\nИмя должно содержать только буквенно-цифровые символы, «-» или «_»\n
invalid-custom-color-key=Automatic Train Painter | [img=utility/warning_icon] Предупреждение: найден неверный ключ цвета: [font=default-large-bold]"__1__"[/font] для предмета [font=default-large-bold]"__2__"[/font]\nНайдено: [font=default-large-bold]"__3__"[/font], ожидалось "abgr"\nТаблица цветов должна содержать значения для "r", "g", "b" и "a"
