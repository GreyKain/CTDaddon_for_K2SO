[mod-setting-description]
ltn-interface-console-level=Уровень детализации внутриигровых сообщений.\n\n0: Выкл\nСообщения не создаются.\n\n1: Ошибки и предупреждения\nВыводятся только ошибки и предупреждения.\n\n2: Уведомления (по умолчанию)\nВыводится основная информация: нехватка ресурсов, создание доставок и т. п.\n\n3: Подробные сообщения\nВыводится подробная информация о поиске станций снабжения и поездов.
ltn-interface-console-messages=Показывать сообщения LTN в чате консоли. Отключите, чтобы скрыть уведомления о доставках и предупреждения только для этого игрока (полезно в мультиплеере).
ltn-interface-factorio-alerts=Показывать ошибки и предупреждения как оповещения Factorio.
ltn-interface-debug-logfile=Записывать отладочную информацию в /Factorio/factorio-current.log.
ltn-dispatcher-enabled=Внимание: отключение диспетчера останавливает создание доставок.\nУровни предметов при этом продолжают отслеживаться.
ltn-dispatcher-nth_tick=Как часто обновляются станции и запросы.\nБольшие значения повышают производительность за счёт распределения обновлений на большее число тиков.
ltn-dispatcher-updates-per-tick=Ограничивает число запросов, обновляемых за тик.\nМеньшие значения повышают производительность.
ltn-dispatcher-route-cache-lifetime=Определяет, как долго LTN хранит вычисленный маршрут в кэше.\nБольшие значения повышают производительность, меньшие — быстрее учитывают новые маршруты.
ltn-dispatcher-route-cache-size=Целевое число записей кэша маршрутов; оба конца поезда считаются отдельно, если используют разные ключи. Размер кэша может временно превышать это значение, пока фоновая очистка досрочно удаляет записи.
ltn-dispatcher-stop-updates-per-tick=Ограничивает число станций, обновляемых за тик.\nМеньшие значения повышают производительность.
ltn-dispatcher-requester-threshold=Нехватка предметов/жидкостей, запускающая доставку.\nМожно переопределить сигналом на станции запроса.\nпо умолчанию = 1000
ltn-dispatcher-provider-threshold=Количество предметов/жидкостей, необходимое для работы станции в качестве снабжающей.\nМожно переопределить сигналом на станции снабжения.\nпо умолчанию = 1000
ltn-dispatcher-schedule-circuit-control=Добавляет всем станциям сигнальное условие ожидания: красный = 0 ИЛИ зелёный ≥ 1.\nВнимание: на всех станциях LTN должна быть включена опция «Отправлять на поезд» и подключён сигнальный провод. Иначе поезда будут ждать бесконечно.\nпо умолчанию = false
ltn-dispatcher-depot-inactivity=Время простоя в секундах, после которого поезда покидают депо.\nпо умолчанию = 5
ltn-dispatcher-stop-timeout=Время в секундах, после которого поезда принудительно покидают станцию.\n0 отключает эту функцию.\nпо умолчанию = 120
ltn-dispatcher-delivery-timeout=Время в секундах, которое может длиться доставка, прежде чем поезд будет считаться потерянным.\nпо умолчанию = 600 (10 мин)
ltn-dispatcher-requester-delivery-reset=False (по умолчанию):\nДоставка и расписание сбрасываются при прибытии поезда в депо.\nИзменения поездов, стоящих на станциях запроса, не имеют эффекта.\n\nTrue:\nДоставка и расписание сбрасываются, когда поезд покидает станцию запроса.\nИзменения поездов, стоящих на станциях запроса, удаляют доставку и сбрасывают расписание.
ltn-dispatcher-finish-loading=True (по умолчанию):\nНе даёт поездам уезжать, пока работают манипуляторы/насосы, добавляя условие простоя 2 с.\n\nFalse:\nПоезда уезжают сразу после погрузки всех предметов.\nМанипуляторы на станциях загрузки будут застревать.
ltn-depot-reset-filters=True (по умолчанию):\nПри въезде в депо у грузовых вагонов сбрасываются фильтры и ограничения стопок.
ltn-depot-fluid-cleaning=Максимальное количество жидкости на вагон, автоматически уничтожаемое при въезде в депо.\n0 — отключить, -1 — удалять всё.
ltn-stop-default-network=ID сети, используемый для станций без сигнала «Закодированный ID сети».
ltn-provider-show-existing-cargo=True (по умолчанию):\nГруз в поезде при прибытии на станцию снабжения отображается в выходе LTN.\nВключая предметы, которые держат манипуляторы над путями.
ltn-provider-ignore-stopped-train=True (по умолчанию):\nИгнорировать стоящий поезд на станции запроса при расчёте отправки на эту станцию.
ltn-schedule-fuel-station=Включить дозаправку поездов на заправочных станциях.\nОтправляет поезда на дозаправку, если у них мало топлива и заправочная станция есть в их текущей сети.
ltn-schedule-reset-interrupts=Удалять все прерывания расписания поезда при прибытии в депо.
ltn-schedule-reselect-depot=(Не действует, если «Доставка завершается на станции запроса» выключено). Если включено, депо, в которое отправится поезд, выбирается заново.
ltn-fuel-station-interrupt=Если включено, для отправки поезда на дозаправку используется прерывание поезда Factorio. Это значение по умолчанию; менять его следует только если прерывание вызывает проблемы. Если выключено, LTN динамически изменяет расписание поезда для отправки на дозаправку. Это требует больше циклов, но позволяет лучше контролировать дозаправку (например, поезд не отправится на дозаправку при прибытии на временную станцию).
ltn-advanced-cross-surface-delivery=Если включено, LTN будет выбирать поезда с других поверхностей для выполнения доставок или сначала отправлять поезда на другие поверхности за грузом. Не включайте, если ваша сеть не охватывает несколько поверхностей и не связана между ними (например, космическим лифтом из Space Exploration).
ltn-depot-fudge-factor=Поезда в пределах этого расстояния от ближайшего равноценного поезда считаются одинаково близкими к станции снабжения. Среди них предпочтение отдаётся поездам с меньшим числом доставок.\nЗадайте значение достаточно большим, чтобы покрыть разницу расстояний между станциями в депо. 0 — предпочитать ближайшие поезда.
ltn-depot-stop-limit-trains=[font=default-semibold][color=red][ЭКСПЕРИМЕНТАЛЬНО!][/color][/font] Управляет поведением настройки «Лимит поездов» для станций депо LTN.
ltn-limit-eligible-trains=Максимальное число поездов, выбираемых из пула доступных поездов для доставки. Помогает производительности в больших сетях. 0 — отключить.

